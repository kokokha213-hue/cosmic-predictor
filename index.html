
<!-- NEW: EVIDENCE FILE SECTION -->
<div class="report-section" id="evidenceSection">
  <h2>📁 Report Evidence File</h2>
  <p>
    Apni report ki details record karein aur evidence file download karein.
  </p>

  <label for="evidenceUsername">TikTok Username / Profile URL</label>
  <input id="evidenceUsername"
         type="text"
         placeholder="@username ya profile URL"
         style="width:100%; margin:8px 0 14px;">

  <label for="evidenceReason">Report Reason</label>
  <select id="evidenceReason"
          style="width:100%; padding:14px; border:2px solid #ddd; border-radius:10px; margin:8px 0 14px;">
    <option>Harassment or bullying</option>
    <option>Impersonation</option>
    <option>Scam or fraud</option>
    <option>Privacy violation</option>
    <option>Copyright infringement</option>
    <option>Other</option>
  </select>

  <label for="evidenceDetails">Evidence Details</label>
  <textarea id="evidenceDetails"
            rows="4"
            placeholder="Maslay ki tafseel aur evidence ki wazahat..."
            style="width:100%; padding:14px; border:2px solid #ddd; border-radius:10px; margin:8px 0 14px; resize:vertical;"></textarea>

  <label for="evidenceScreenshot">Evidence Screenshot (optional)</label>
  <input id="evidenceScreenshot"
         type="file"
         accept="image/*"
         style="width:100%; margin:8px 0 14px;">

  <button type="button"
          class="report-main-btn"
          onclick="downloadEvidenceFile()">
    📥 Download Evidence File
  </button>

  <a href="https://www.tiktok.com/legal/report/feedback"
     target="_blank"
     rel="noopener noreferrer"
     class="report-main-btn"
     style="margin-top:12px;">
    🚩 Open Official TikTok Report Page
  </a>

  <div class="report-note">
    Evidence file sirf aapke record ke liye hai.
    Report TikTok par alag se submit karni hogi.
  </div>
</div>
