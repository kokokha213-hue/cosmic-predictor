<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Profile Viewer</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #000000, #25F4EE, #FE2C55);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    background: #fff;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 500px;
    text-align: center;
  }

  h1 {
    color: #FE2C55;
    margin-bottom: 10px;
    font-size: 26px;
  }

  p.subtitle {
    color: #666;
    font-size: 14px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
  }

  input:focus {
    border-color: #25F4EE;
    box-shadow: 0 0 10px rgba(37,244,238,0.4);
  }

  button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    background: linear-gradient(90deg, #25F4EE, #FE2C55);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(254,44,85,0.4);
  }

  #result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 12px;
    background: #f9f9f9;
    display: none;
    word-wrap: break-word;
  }

  #result a {
    color: #FE2C55;
    font-weight: bold;
    text-decoration: none;
    font-size: 16px;
  }

  #result a:hover {
    text-decoration: underline;
  }

  .loading {
    color: #25F4EE;
    font-weight: bold;
  }

  iframe {
    margin-top: 15px;
    width: 100%;
    max-width: 340px;
    height: 580px;
    border: none;
    border-radius: 12px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎵 TikTok Profile Viewer</h1>
  <p class="subtitle">Username ya link dalo aur direct dekho</p>

  <input type="text" id="tiktokInput" placeholder="e.g. @username ya https://tiktok.com/@username" />

  <button onclick="showProfile()">Show Profile</button>

  <div id="result"></div>
</div>

<script>
  function showProfile() {
    const input = document.getElementById('tiktokInput').value.trim();
    const result = document.getElementById('result');

    if (!input) {
      result.style.display = 'block';
      result.innerHTML = '<span style="color:#FE2C55;">⚠️ Pehle username ya link dalo!</span>';
      return;
    }

    let username = '';

    // Agar full link diya hai
    if (input.includes('tiktok.com')) {
      const match = input.match(/@([a-zA-Z0-9._]+)/);
      if (match) username = match[1];
    } 
    // Agar @username diya hai
    else if (input.startsWith('@')) {
      username = input.substring(1);
    } 
    // Agar sirf username diya hai
    else {
      username = input;
    }

    if (!username) {
      result.style.display = 'block';
      result.innerHTML = '<span style="color:#FE2C55;">❌ Sahi username ya link dalo!</span>';
      return;
    }

    const profileUrl = `https://www.tiktok.com/@${username}`;

    result.style.display = 'block';
    result.innerHTML = `
      <p style="color:#333; margin-bottom:10px;">✅ Profile:</p>
      <a href="${profileUrl}" target="_blank">${profileUrl}</a>
      <br><br>
      <iframe src="${profileUrl}" allowfullscreen></iframe>
    `;
  }

  // Enter key support
  document.getElementById('tiktokInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') showProfile();
  });
</script>

</body>
</html>
