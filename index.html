<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Profile Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #000000, #25F4EE, #FE2C55);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .container {
    background: #fff;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 700px;
  }
  
  h1 {
    color: #FE2C55;
    text-align: center;
    margin-bottom: 8px;
    font-size: 26px;
  }
  
  p.subtitle {
    color: #666;
    font-size: 13px;
    text-align: center;
    margin-bottom: 22px;
  }
  
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  
  input {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
  }
  
  input:focus {
    border-color: #25F4EE;
    box-shadow: 0 0 10px rgba(37,244,238,0.4);
  }
  
  button.show-btn {
    padding: 14px 24px;
    background: linear-gradient(90deg, #25F4EE, #FE2C55);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap;
  }
  
  button.show-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(254,44,85,0.4);
  }
  
  button.show-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  
  #result {
    margin-top: 10px;
    display: none;
  }
  
  /* Loading spinner */
  .loader {
    text-align: center;
    padding: 40px 20px;
  }
  
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f0f0f0;
    border-top: 5px solid #FE2C55;
    border-radius: 50%;
    margin: 0 auto 15px;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .loader p {
    color: #666;
    font-size: 14px;
  }
  
  /* Profile Card */
  .profile-card {
    background: linear-gradient(135deg, #25F4EE15, #FE2C5515);
    border: 2px solid #25F4EE40;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25F4EE, #FE2C55);
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    box-shadow: 0 8px 20px rgba(254,44,85,0.3);
  }
  
  .username {
    font-size: 20px;
    font-weight: bold;
    color: #111;
    margin-bottom: 6px;
  }
  
  .tag {
    display: inline-block;
    background: #FE2C55;
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 18px;
  }
  
  .action-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: #000;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    margin-top: 10px;
    transition: 0.2s;
    text-align: center;
  }
  
  .action-btn:hover {
    background: #FE2C55;
  }
  
  /* Videos Section */
  .videos-title {
    color: #111;
    font-size: 17px;
    font-weight: bold;
    margin: 20px 0 12px;
    text-align: center;
  }
  
  .videos-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  
  .tiktok-embed {
    margin: 0 auto !important;
    max-width: 325px !important;
    min-width: 280px !important;
  }
  
  /* Error */
  .error {
    color: #FE2C55;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    background: #fff0f3;
    border-radius: 12px;
    line-height: 1.6;
  }
  
  .info-note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
    padding: 10px;
    background: #f9f9f9;
    border-radius: 8px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎵 TikTok Profile Viewer</h1>
  <p class="subtitle">Username ya link dalo — profile + recent videos dekho</p>

  <div class="search-box">
    <input type="text" id="tiktokInput" 
           placeholder="e.g. @khaby.lame ya https://tiktok.com/@username" 
           autocomplete="off" />
    <button class="show-btn" id="showBtn" onclick="showProfile()">🔍 Show</button>
  </div>

  <div id="result"></div>
</div>

<!-- TikTok Official Embed Script - Sirf EK Dafa -->
<script async src="https://www.tiktok.com/embed.js"></script>

<script>
  let isLoading = false;

  function showProfile() {
    if (isLoading) return;
    
    const input = document.getElementById('tiktokInput').value.trim();
    const result = document.getElementById('result');
    const btn = document.getElementById('showBtn');

    if (!input) {
      result.style.display = 'block';
      result.innerHTML = '<div class="error">⚠️ Pehle username ya link dalo!</div>';
      return;
    }

    // Username extract karo
    let username = '';
    if (input.includes('tiktok.com')) {
      const match = input.match(/@([a-zA-Z0-9._]+)/);
      if (match) username = match[1];
    } else if (input.startsWith('@')) {
      username = input.substring(1);
    } else {
      username = input;
    }

    username = username.replace(/[\/\s?]+.*$/, '').toLowerCase();

    if (!username) {
      result.style.display = 'block';
      result.innerHTML = '<div class="error">❌ Sahi username dalo!</div>';
      return;
    }

    // Loading start
    isLoading = true;
    btn.disabled = true;
    btn.textContent = '⏳ Wait...';
    result.style.display = 'block';
    result.innerHTML = `
      <div class="loader">
        <div class="spinner"></div>
        <p>Profile load ho rahi hai...</p>
      </div>
    `;

    // Profile URL
    const profileUrl = `https://www.tiktok.com/@${username}`;
    const initial = username.charAt(0).toUpperCase();

    // 2 second baad profile card + embed show karo
    setTimeout(() => {
      result.innerHTML = `
        <div class="profile-card">
          <div class="avatar">${initial}</div>
          <div class="username">@${username}</div>
          <span class="tag">TIKTOK CREATOR</span>
          <a class="action-btn" href="${profileUrl}" target="_blank" rel="noopener">
            🎵 TikTok Par Full Profile Kholo
          </a>
        </div>

        <div class="videos-title">📹 Recent Videos</div>
        <div class="videos-container" id="videosContainer"></div>

        <div class="info-note">
          ℹ️ TikTok sirf public accounts ke recent videos embed karta hai. 
          Private/restricted accounts ke videos show nahi honge.
        </div>
      `;

      // Creator profile embed load karo
      loadCreatorEmbed(username);

      // Button reset
      isLoading = false;
      btn.disabled = false;
      btn.textContent = '🔍 Show';
    }, 800);
  }

  // ===== Creator Profile Embed Load =====
  function loadCreatorEmbed(username) {
    const container = document.getElementById('videosContainer');
    
    // Official TikTok creator embed
    const blockquote = document.createElement('blockquote');
    blockquote.className = 'tiktok-embed';
    blockquote.setAttribute('cite', `https://www.tiktok.com/@${username}`);
    blockquote.setAttribute('data-unique-id', username);
    blockquote.setAttribute('data-embed-type', 'creator');
    blockquote.style.maxWidth = '325px';
    blockquote.style.minWidth = '280px';

    const section = document.createElement('section');
    const link = document.createElement('a');
    link.target = '_blank';
    link.href = `https://www.tiktok.com/@${username}?refer=creator_embed`;
    link.textContent = `@${username}`;
    section.appendChild(link);
    blockquote.appendChild(section);

    container.innerHTML = '';
    container.appendChild(blockquote);

    // TikTok script ko re-process karo (safely)
    setTimeout(() => {
      // Purani embed.js remove karo
      const oldScripts = document.querySelectorAll('script[src*="tiktok.com/embed.js"]');
      oldScripts.forEach(s => s.remove());
      
      // Nayi script add karo
      const script = document.createElement('script');
      script.src = 'https://www.tiktok.com/embed.js';
      script.async = true;
      document.body.appendChild(script);
      
      // 4 second baad check karo ke embed load hua ya nahi
      setTimeout(() => {
        const iframe = container.querySelector('iframe');
        if (!iframe) {
          container.innerHTML = `
            <div class="error" style="width:100%;">
              ❌ Yeh profile embed nahi ho saki.<br>
              <small style="font-weight:normal; color:#666;">
                Wajah: Private account, underage account, ya embed disabled hai.
              </small>
              <br><br>
              <a href="https://www.tiktok.com/@${username}" target="_blank" 
                 style="color:#FE2C55; font-weight:bold; text-decoration:none;">
                🔗 Direct TikTok Par Dekho
              </a>
            </div>
          `;
        }
      }, 4000);
    }, 200);
  }

  // Enter key support
  document.getElementById('tiktokInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') showProfile();
  });
</script>

</body>
</html>
