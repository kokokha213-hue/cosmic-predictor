<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Profile Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #000000, #25F4EE, #FE2C55);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .container {
    background: #fff;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 700px;
  }
  
  h1 {
    color: #FE2C55;
    text-align: center;
    margin-bottom: 8px;
    font-size: 24px;
  }
  
  p.subtitle {
    color: #666;
    font-size: 13px;
    text-align: center;
    margin-bottom: 22px;
  }
  
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  
  input {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;
  }
  
  input:focus {
    border-color: #25F4EE;
    box-shadow: 0 0 10px rgba(37,244,238,0.4);
  }
  
  button.show-btn {
    padding: 14px 24px;
    background: linear-gradient(90deg, #25F4EE, #FE2C55);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  
  button.show-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(254,44,85,0.4);
  }
  
  #result {
    margin-top: 10px;
    display: none;
  }
  
  .error {
    color: #FE2C55;
    font-weight: bold;
    text-align: center;
    padding: 20px;
    background: #fff0f3;
    border-radius: 12px;
    line-height: 1.6;
  }
  
  .info-note {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 15px;
    line-height: 1.5;
    padding: 10px;
    background: #f9f9f9;
    border-radius: 8px;
  }
  
  .tiktok-embed {
    margin: 0 auto !important;
    max-width: 100% !important;
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎵 TikTok Profile Viewer</h1>
  <p class="subtitle">Username dalo — profile + recent videos dekho</p>

  <div class="search-box">
    <input type="text" id="tiktokInput" 
           placeholder="e.g. @khaby.lame ya https://tiktok.com/@username" 
           autocomplete="off" />
    <button class="show-btn" onclick="showProfile()">🔍 Show</button>
  </div>

  <div id="result"></div>
</div>

<!-- TikTok Official Embed Script - Sirf EK Dafa Load Hoga -->
<script async src="https://www.tiktok.com/embed.js"></script>

<script>
function showProfile() {
  const input = document.getElementById('tiktokInput').value.trim();
  const result = document.getElementById('result');

  if (!input) {
    result.style.display = 'block';
    result.innerHTML = '<div class="error">⚠️ Pehle username ya link dalo!</div>';
    return;
  }

  // Username extract karo
  let username = '';
  if (input.includes('tiktok.com')) {
    const match = input.match(/@([a-zA-Z0-9._]+)/);
    if (match) username = match[1];
  } else if (input.startsWith('@')) {
    username = input.substring(1);
  } else {
    username = input;
  }

  username = username.replace(/[\/\s?]+.*$/, '').toLowerCase();

  if (!username) {
    result.style.display = 'block';
    result.innerHTML = '<div class="error">❌ Sahi username dalo!</div>';
    return;
  }

  // TikTok ka official Creator Profile Embed code generate karo
  const embedHTML = `
    <blockquote class="tiktok-embed" 
      cite="https://www.tiktok.com/@${username}" 
      data-unique-id="${username}" 
      data-embed-type="creator" 
      style="max-width: 605px; min-width: 288px;">
      <section>
        <a target="_blank" href="https://www.tiktok.com/@${username}?refer=creator_embed">@${username}</a>
      </section>
    </blockquote>
  `;

  result.style.display = 'block';
  result.innerHTML = embedHTML + '<div class="info-note">ℹ️ Videos tab par click karke recent videos dekh sakte ho. Private accounts embed nahi hote.</div>';

  // TikTok script ko re-process karo (safely)
  setTimeout(() => {
    const oldScript = document.querySelector('script[src*="tiktok.com/embed.js"]');
    if (oldScript) oldScript.remove();
    
    const script = document.createElement('script');
    script.src = 'https://www.tiktok.com/embed.js';
    script.async = true;
    document.body.appendChild(script);
  }, 100);
}

// Enter key support
document.getElementById('tiktokInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') showProfile();
});
</script>

</body>
</html>
