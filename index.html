<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TikTok Profile Embed</title>
  <style>
    body {
      background: linear-gradient(135deg, #000, #25F4EE, #FE2C55);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    h1 { color: #FE2C55; text-align: center; }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      background: linear-gradient(90deg, #25F4EE, #FE2C55);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 25px;
      min-height: 80px;
    }
    .error {
      color: #FE2C55;
      font-weight: bold;
      padding: 15px;
      background: #fff0f3;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎵 TikTok Profile Viewer</h1>
  <input type="text" id="usernameInput" placeholder="Username ya link dalo (e.g. @khaby.lame)" />
  <button onclick="showProfile()">Show Profile</button>
  <div id="result"></div>
</div>

<script>
function showProfile() {
  const input = document.getElementById('usernameInput').value.trim();
  const result = document.getElementById('result');
  
  if (!input) {
    result.innerHTML = '<div class="error">⚠️ Pehle username ya link dalo!</div>';
    return;
  }
  
  // Extract username from input
  let username = '';
  if (input.includes('tiktok.com')) {
    const match = input.match(/@([a-zA-Z0-9._]+)/);
    if (match) username = match[1];
  } else if (input.startsWith('@')) {
    username = input.substring(1);
  } else {
    username = input;
  }
  
  if (!username) {
    result.innerHTML = '<div class="error">❌ Sahi username dalo!</div>';
    return;
  }
  
  // Official TikTok embed code
  const embedHTML = `
    <blockquote class="tiktok-embed" 
      cite="https://www.tiktok.com/@${username}" 
      data-unique-id="${username}" 
      data-embed-type="creator" 
      style="max-width: 605px; min-width: 288px;">
      <section>
        <a target="_blank" href="https://www.tiktok.com/@${username}?refer=creator_embed">@${username}</a>
      </section>
    </blockquote>
  `;
  
  // Set innerHTML, then append script AFTER
  result.innerHTML = embedHTML;
  
  // Remove old TikTok script if exists
  const oldScript = document.querySelector('script[src*="tiktok.com/embed.js"]');
  if (oldScript) oldScript.remove();
  
  // Add TikTok script
  const script = document.createElement('script');
  script.src = 'https://www.tiktok.com/embed.js';
  script.async = true;
  document.body.appendChild(script);
}
</script>

</body>
</html>
